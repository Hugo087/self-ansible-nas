---
# "Seerr" est le projet unifié qui a remplacé Overseerr et Jellyseerr (fusion
# des deux codebases). Contrairement à l'ancien Jellyseerr, cette image tourne
# rootless par défaut et n'utilise PAS PUID/PGID : le template fixe
# explicitement User={{ quadlet_uid }}:{{ quadlet_gid }} pour faire
# correspondre les fichiers créés à svc-media côté hôte.

# Créé explicitement ici, AVANT le include quadlet_common ci-dessous :
# comme pour caddy/pds/voidauth, le quadlet seerr.container bind-monte
# healthcheck.sh (voir seerr.container.j2), donc ce fichier doit déjà
# exister sur le disque avant que quadlet_common (tâche suivante) ne
# démarre le service - sinon podman échoue avec "statfs ...: no such file
# or directory".
- name: Créer le dossier appdata de Seerr
  ansible.builtin.file:
    path: "{{ ssd_mountpoint }}/appdata/seerr"
    state: directory
    owner: "{{ media_user }}"
    group: "{{ media_user }}"
    mode: "0750"
    recurse: true

- name: Déployer le script de healthcheck de Seerr
  ansible.builtin.template:
    src: healthcheck.sh.j2
    dest: "{{ ssd_mountpoint }}/appdata/seerr/healthcheck.sh"
    owner: "{{ media_user }}"
    group: "{{ media_user }}"
    mode: "0755"

- name: Déployer Seerr (appdata, quadlet, service)
  ansible.builtin.include_tasks: ../../quadlet_common/tasks/deploy.yml
  vars:
    quadlet_user: "{{ media_user }}"
    quadlet_name: "seerr"
    quadlet_units:
      - src: seerr.container.j2
        name: seerr.container
        service: seerr.service
