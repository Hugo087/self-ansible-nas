---
# Rôle partagé exécuté une fois avant tous les rôles de la stack média
# (jellyfin, sonarr, radarr, prowlarr, downloader...). Ne rien mettre ici
# de spécifique à un service en particulier.

- name: Vérifier que le pool ZFS (HDD) est bien monté avant de continuer
  ansible.builtin.assert:
    that:
      - hdd_mountpoint in (ansible_facts.mounts | map(attribute='mount') | list)
    fail_msg: >
      {{ hdd_mountpoint }} n'est pas monté. Le pool ZFS n'a probablement pas
      été importé — vérifie le rôle `zfs` avant de continuer. Ne pas créer ce
      dossier à la main, ça masquerait le vrai problème (les containers
      écriraient alors dans un dossier vide au lieu du pool réel).
    success_msg: "{{ hdd_mountpoint }} est bien monté."

- name: Créer le sous-dossier media dans le pool ZFS (si absent)
  ansible.builtin.file:
    path: "{{ hdd_mountpoint }}/media"
    state: directory
    owner: "{{ media_user }}"
    group: "{{ media_user }}"
    mode: "0775"

- name: Récupérer l'UID de l'utilisateur média
  ansible.builtin.command:
    cmd: "id -u {{ media_user }}"
  register: media_common_user_info
  changed_when: false

- name: Créer le dossier des quadlets pour l'utilisateur média
  ansible.builtin.file:
    path: "/home/{{ media_user }}/.config/containers/systemd"
    state: directory
    owner: "{{ media_user }}"
    group: "{{ media_user }}"
    mode: "0755"

- name: Déployer le quadlet du réseau partagé média
  ansible.builtin.template:
    src: media.network.j2
    dest: "/home/{{ media_user }}/.config/containers/systemd/media.network"
    owner: "{{ media_user }}"
    group: "{{ media_user }}"
    mode: "0644"

- name: Forcer le systemd --user daemon-reload (média)
  become: true
  become_user: "{{ media_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ media_common_user_info.stdout | trim }}"
  ansible.builtin.systemd:
    scope: user
    daemon_reload: true
