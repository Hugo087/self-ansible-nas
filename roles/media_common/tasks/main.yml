---
# Rôle partagé exécuté une fois avant tous les rôles de la stack média
# (jellyfin, sonarr, radarr, prowlarr, downloader...). Ne rien mettre ici
# de spécifique à un service en particulier.

# Le bit setgid (le "2" devant 775) est ce qui permet à Samba (via le rôle
# samba, share [Media]) et aux containers *arr de se partager ces dossiers
# sans conflit : tout nouveau fichier/dossier créé dedans hérite automatiquement
# du groupe svc-media, qu'il soit créé par Sonarr (PUID/PGID) ou par un
# utilisateur Samba (force group = svc-media dans le share).
- name: Créer le sous-dossier des séries dans le pool ZFS (si absent)
  ansible.builtin.file:
    path: "{{ hdd_mountpoint }}/media/tvshows"
    state: directory
    owner: "{{ media_user }}"
    group: "{{ media_user }}"
    mode: "02775"

- name: Créer le sous-dossier films dans le pool ZFS (si absent)
  ansible.builtin.file:
    path: "{{ hdd_mountpoint }}/media/movies"
    state: directory
    owner: "{{ media_user }}"
    group: "{{ media_user }}"
    mode: "02775"

- name: Créer le sous-dossier de téléchargement dans le pool ZFS (si absent)
  ansible.builtin.file:
    path: "{{ hdd_mountpoint }}/media/downloads"
    state: directory
    owner: "{{ media_user }}"
    group: "{{ media_user }}"
    mode: "02775"

- name: Récupérer l'UID de l'utilisateur média
  ansible.builtin.command:
    cmd: "id -u {{ media_user }}"
  register: media_common_user_info
  changed_when: false

- name: Créer le dossier des quadlets pour l'utilisateur média
  ansible.builtin.file:
    path: "/home/{{ media_user }}/.config/containers/systemd"
    state: directory
    owner: "{{ media_user }}"
    group: "{{ media_user }}"
    mode: "0755"

- name: Déployer le quadlet du réseau partagé média
  ansible.builtin.template:
    src: media.network.j2
    dest: "/home/{{ media_user }}/.config/containers/systemd/media.network"
    owner: "{{ media_user }}"
    group: "{{ media_user }}"
    mode: "0644"

- name: Forcer le systemd --user daemon-reload (média)
  become: true
  become_user: "{{ media_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ media_common_user_info.stdout | trim }}"
  ansible.builtin.systemd:
    scope: user
    daemon_reload: true
