---
- name: Déployer Jellyfin (appdata, quadlet, service)
  ansible.builtin.include_tasks: ../../quadlet_common/tasks/deploy.yml
  vars:
    quadlet_user: "{{ media_user }}"
    quadlet_name: "jellyfin"
    quadlet_units:
      - src: jellyfin.container.j2
        name: jellyfin.container
        service: jellyfin.service
