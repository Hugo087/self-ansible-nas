---
- name: Récupérer l'UID de l'utilisateur doc
  ansible.builtin.command:
    cmd: "id -u {{ doc_user }}"
  register: quantum_doc_uid
  changed_when: false

- name: Récupérer le GID de l'utilisateur doc
  ansible.builtin.command:
    cmd: "id -g {{ doc_user }}"
  register: quantum_doc_gid
  changed_when: false

- name: Créer le dossier appdata Quantum
  ansible.builtin.file:
    path: "{{ ssd_mountpoint }}/appdata/quantum/config"
    state: directory
    owner: "{{ doc_user }}"
    group: "{{ doc_user }}"
    mode: "0755"

- name: Déployer la configuration Filebrowser
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "{{ ssd_mountpoint }}/appdata/quantum/config/config.yaml"
    owner: "{{ doc_user }}"
    group: "{{ doc_user }}"
    mode: "0644"

- name: Créer le sous-dossier de documents dans le pool ZFS
  ansible.builtin.file:
    path: "{{ hdd_mountpoint }}/documents"
    state: directory
    owner: "{{ doc_user }}"
    group: "{{ doc_user }}"
    mode: "02775"

- name: Déployer le quadlet Quantum
  ansible.builtin.template:
    src: quantum.container.j2
    dest: "/home/{{ doc_user }}/.config/containers/systemd/quantum.container"
    owner: "{{ doc_user }}"
    group: "{{ doc_user }}"
    mode: "0644"
  vars:
    quantum_uid: "{{ quantum_doc_uid.stdout | trim }}"
    quantum_gid: "{{ quantum_doc_gid.stdout | trim }}"

# Pas de notify/handler ici : le daemon-reload est fait directement ci-dessous,
# dans l'ordre, pour éviter le genre d'oubli de fichier handler déjà rencontré
# sur les rôles précédents.
- name: Forcer le systemd --user daemon-reload (quantum)
  become: true
  become_user: "{{ doc_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ quantum_doc_uid.stdout | trim }}"
  ansible.builtin.systemd:
    scope: user
    daemon_reload: true

- name: Démarrer et activer Quantum
  become: true
  become_user: "{{ doc_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ quantum_doc_uid.stdout | trim }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ quantum_doc_uid.stdout | trim }}/bus"
  ansible.builtin.systemd:
    name: quantum.service
    scope: user
    state: started
    enabled: true
