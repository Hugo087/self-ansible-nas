---
- name: Installer fail2ban
  ansible.builtin.dnf:
    name: fail2ban
    state: present

- name: Définir les contextes SELinux pour la chaîne de répertoires menant aux logs Caddy
  community.general.sefcontext:
    target: "{{ item }}"
    setype: var_t
    state: present
  loop:
    - "/mnt/SSD"
    - "/mnt/SSD/appdata"
    - "/mnt/SSD/appdata/caddy"
  notify: Restorcon fail2ban

- name: Déployer le filtre fail2ban pour les logs JSON de Caddy
  ansible.builtin.template:
    src: caddy-auth.conf.j2
    dest: /etc/fail2ban/filter.d/caddy-auth.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban

- name: Déployer le filtre fail2ban pour le scan d'URL agressif (optionnel)
  ansible.builtin.template:
    src: caddy-scan.conf.j2
    dest: /etc/fail2ban/filter.d/caddy-scan.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban

- name: Déployer jail.local
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban

# Le restart effectif ne se déclenche (handler) que si un des templates
# ci-dessus a réellement changé, plutôt qu'à chaque exécution du playbook.
- name: S'assurer que fail2ban est démarré et activé
  ansible.builtin.systemd:
    name: fail2ban
    state: started
    enabled: true
