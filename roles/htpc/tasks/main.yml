---
# Rôle "à part" comme annoncé dans le README : suppose un vrai écran/GPU
# branché sur cette machine (le NAS physique, pas la VM de test des autres
# rôles). Lance-le explicitement avec --tags htpc sur le vrai matériel, ou
# saute-le avec --skip-tags htpc ailleurs (rien à voir sur un écran dans une
# VM sans GPU dédié de toute façon).

- name: Activer RPM Fusion Free (nécessaire pour le paquet kodi)
  # disable_gpg_check nécessaire ici (mise à jour de la note précédente,
  # devenue fausse avec dnf5) : sur les Fedora récents (dnf5, par défaut
  # depuis Fedora 41+, généralisé en 43), installer un RPM par URL crée un
  # dépôt éphémère "@commandline" et dnf5 refuse maintenant catégoriquement
  # ("The repository does not have any OpenPGP keys configured") au lieu
  # du simple avertissement/prompt qu'affichait dnf4 dans ce cas précis.
  # C'est un problème d'œuf-et-poule inhérent aux paquets "-release" : ce
  # paquet apporte lui-même la clé GPG du dépôt RPM Fusion, donc on ne peut
  # pas vérifier sa propre signature avec une clé qu'il n'a pas encore
  # déposée sur le système. Le disable_gpg_check ne concerne QUE ce paquet
  # bootstrap : tout ce qui sera installé depuis le dépôt RPM Fusion une
  # fois activé (kodi, etc.) reste vérifié normalement contre la vraie clé
  # que ce paquet installe.
  ansible.builtin.dnf:
    name: "{{ rpmfusion_free_release_rpm }}"
    state: present
    disable_gpg_check: true

# COPR tiers non officiel : ni Fedora ni RPM Fusion ne packagent
# moonlight-qt. Vérifie que ce COPR est toujours actif avant de lancer ce
# rôle (les dépôts communautaires apparaissent/disparaissent avec le
# temps) : dnf copr enable {{ moonlight_copr }} puis dnf search moonlight
# pour confirmer le nom exact du paquet avant de t'y fier en prod.
- name: Activer le dépôt COPR de moonlight-qt
  community.general.copr:
    name: "{{ moonlight_copr }}"
    state: enabled

- name: Installer Kodi, gamescope et Moonlight
  ansible.builtin.dnf:
    name:
      - kodi
      - gamescope
      - moonlight-qt
    state: present

# Groupes video/render/input/audio en filet de sécurité : la session logind
# (PAMName=login dans htpc.service) attribue normalement les ACL DRM/input
# du seat dynamiquement, mais autant ne pas dépendre uniquement de ça.
- name: Créer l'utilisateur système dédié à la session HTPC
  ansible.builtin.user:
    name: "{{ htpc_user }}"
    system: true
    shell: /usr/sbin/nologin
    home: "/home/{{ htpc_user }}"
    create_home: true
    groups:
      - video
      - render
      - input
      - audio
    append: true

- name: Déployer le script dispatcher Kodi <-> Moonlight
  ansible.builtin.template:
    src: htpc-dispatcher.sh.j2
    dest: /usr/local/bin/htpc-dispatcher.sh
    owner: root
    group: root
    mode: "0755"

- name: Déployer l'unité systemd de la session HTPC
  ansible.builtin.template:
    src: htpc.service.j2
    dest: /etc/systemd/system/htpc.service
    owner: root
    group: root
    mode: "0644"

# htpc.service prend possession de {{ htpc_tty }} pour y afficher Kodi ou
# Moonlight : le getty par défaut dessus se battrait pour le même terminal
# virtuel. `enabled: false` seul ne fait qu'empêcher son démarrage au
# prochain boot - s'il tourne déjà (premier déploiement sans reboot entre
# temps), il resterait actif et en concurrence avec htpc.service sur le
# même tty tant qu'aucun reboot n'a lieu : `state: stopped` l'arrête aussi
# immédiatement. Pas de notify/handler ici (même choix que les autres
# rôles) : daemon-reload fait directement dans la tâche suivante.
- name: Désactiver et arrêter le getty par défaut sur {{ htpc_tty }}
  ansible.builtin.systemd:
    name: "getty@{{ htpc_tty }}.service"
    enabled: false
    state: stopped

- name: Activer et démarrer la session HTPC
  ansible.builtin.systemd:
    daemon_reload: true
    name: htpc.service
    enabled: true
    state: started
