# roles/wireguard/tasks/main.yml
---
# wg-easy (WireGuard + interface web d'admin), pour un accès distant aux
# services qui ne sont normalement joignables qu'en local (127.0.0.1) ou
# depuis le LAN (voir roles/caddy, snippet lan_only).
#
# Rôle volontairement séparé du reste : c'est le SEUL endroit de tout ce
# projet où un container tourne réellement en root, avec Network=host.
# Toutes les autres apps passent par quadlet_common (rootless,
# become_user), qui ne convient pas ici - créer l'interface wg0 dans le
# netns de l'hôte exige d'être root dans CE namespace précis, ce qu'un
# utilisateur non-root ne peut structurellement pas obtenir (propriété des
# namespaces Linux, pas une histoire de capabilities mal choisies). D'où un
# chemin de déploiement dédié ci-dessous plutôt que l'include habituel de
# ../../quadlet_common/tasks/deploy.yml.

- name: Modules netfilter requis pour le MASQUERADE de wg-easy
  community.general.modprobe:
    name: "{{ item }}"
    state: present
    persistent: present
  loop:
    - wireguard
    - ip_tables
    - iptable_nat
    - iptable_filter
    - ip6_tables
    - ip6table_nat
    - ip6table_filter

- name: Sysctl requis pour le forwarding WireGuard
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/99-wireguard.conf
    state: present
    reload: true
  loop:
    - { name: net.ipv4.ip_forward, value: "1" }
    - { name: net.ipv4.conf.all.src_valid_mark, value: "1" }

- name: Créer le dossier appdata de wg-easy
  # 0700 (pas 0750 comme les autres rôles) : ce dossier contient les clés
  # privées WireGuard du serveur ET de chaque pair - contrairement à
  # appdata/<service>/config pour le reste du projet, rien ne justifie
  # qu'un autre compte du système (même un compte de service) y ait accès.
  ansible.builtin.file:
    path: "{{ ssd_mountpoint }}/appdata/wireguard/data"
    state: directory
    owner: root
    group: root
    mode: "0700"
    recurse: true

- name: Créer le dossier des quadlets système
  ansible.builtin.file:
    path: /etc/containers/systemd
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Déployer le quadlet wg-easy (système, root - pas ~/.config/containers/systemd)
  ansible.builtin.template:
    src: wg-easy.container.j2
    dest: /etc/containers/systemd/wg-easy.container
    owner: root
    group: root
    mode: "0644"
  register: wireguard_quadlet_deployed

- name: "Forcer le daemon-reload système (systemd, pas --user)"
  ansible.builtin.systemd:
    daemon_reload: true

- name: Démarrer et activer wg-easy.service
  # Comme quadlet_common : restart seulement si quelque chose a réellement
  # changé (quadlet ou .env), pour ne pas couper les pairs déjà connectés à
  # chaque run ansible qui ne modifie rien.
  ansible.builtin.systemd:
    name: wg-easy.service
    state: "{{ 'restarted' if (wireguard_quadlet_deployed.changed or wireguard_env_deployed.changed) else 'started' }}"
    enabled: true

# Uniquement le tunnel WireGuard lui-même. PAS de règle pour
# wg_easy_ui_port (51821) ici, volontairement - même raisonnement que
# Cockpit (roles/zfs/tasks/main.yml) : l'UI n'est jamais censée être
# joignable directement, ni depuis le LAN ni depuis internet, seulement via
# Caddy en loopback (127.0.0.1:{{ wg_easy_ui_port }}, voir
# roles/caddy/templates/Caddyfile.j2, bloc vpn.{{ public_domain }}). Ajouter
# une règle firewalld pour ce port serait donc strictement inutile, et irait
# à l'encontre de la défense en profondeur recherchée ici.
#
# Rappel (à faire manuellement, pas automatisable depuis ce playbook) :
# seul {{ wg_easy_port }}/udp doit être redirigé depuis internet sur ton
# routeur - jamais {{ wg_easy_ui_port }}.
- name: Ouvrir uniquement le port WireGuard (tunnel) dans firewalld
  ansible.posix.firewalld:
    port: "{{ wg_easy_port }}/udp"
    permanent: true
    immediate: true
    state: enabled
