---
# Bluesky PDS (Personal Data Server) - voir https://github.com/bluesky-social/pds
#
# Contrairement à tout le reste de cette stack (Jellyfin, VoidAuth, Immich,
# les *arr...) : ce service DOIT être joignable publiquement en HTTPS avec
# un vrai certificat, sur un vrai nom de domaine (voir pds_hostname,
# group_vars/all/vars.yml) - le protocole AT (fédération avec les autres
# PDS, résolution du DID via plc.directory, appli mobile Bluesky) n'a pas
# d'équivalent au "tls internal" utilisé pour le reste de
# {{ public_domain }}. C'est aussi pourquoi ce vhost, seul dans tout le
# Caddyfile, n'a NI lan_only NI voidauth_auth devant lui - voir le
# commentaire dédié dans roles/caddy/templates/Caddyfile.j2.
#
# Stockage SQLite interne (pas de conteneur DB séparé comme pour
# VoidAuth/Immich) : tout vit sous un seul dossier appdata/pds/data monté
# sur /pds dans le conteneur (base des comptes, blobs uploadés, clés de
# rotation). Voir le README, section PDS, pour l'importance de sauvegarder
# ce dossier.

- name: Créer le dossier appdata de PDS
  # mode 0750, créé explicitement ici (comme pour caddy/voidauth) : le
  # quadlet pds.container bind-monte healthcheck.sh (voir
  # pds.container.j2), donc ce fichier doit déjà exister sur le disque
  # avant que quadlet_common (tâche suivante) ne démarre le service -
  # sinon podman échoue avec "statfs ...: no such file or directory".
  ansible.builtin.file:
    path: "{{ ssd_mountpoint }}/appdata/pds"
    state: directory
    owner: "{{ pds_user }}"
    group: "{{ pds_user }}"
    mode: "0750"
    recurse: true

- name: Déployer le script de healthcheck du PDS
  ansible.builtin.template:
    src: healthcheck.sh.j2
    dest: "{{ ssd_mountpoint }}/appdata/pds/healthcheck.sh"
    owner: "{{ pds_user }}"
    group: "{{ pds_user }}"
    mode: "0755"

- name: Déployer PDS (appdata, réseau, secrets, quadlet, service)
  ansible.builtin.include_tasks: ../../quadlet_common/tasks/deploy.yml
  vars:
    quadlet_user: "{{ pds_user }}"
    quadlet_name: "pds"
    quadlet_appdata_dirs:
      - data
    quadlet_env_files:
      - src: pds.env.j2
        dest: "{{ ssd_mountpoint }}/appdata/pds/pds.env"
    quadlet_units:
      # Pas de clé "service" pour le réseau : cf. commentaire dans
      # quadlet_common/tasks/deploy.yml.
      - src: pds.network.j2
        name: pds.network
      - src: pds.container.j2
        name: pds.container
        service: pds.service
