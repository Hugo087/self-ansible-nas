# roles/podman/tasks/main.yml
---
- name: Installer Podman et podman-compose
  ansible.builtin.dnf:
    name:
      - podman
      - podman-compose
      - podman-docker
      - cockpit-podman
    state: present

- name: Créer le dossier racine appdata (parent commun, un sous-dossier par service)
  ansible.builtin.file:
    path: "{{ ssd_mountpoint }}/appdata"
    state: directory
    mode: "0755"

- name: Créer le dossier racine du stockage Podman
  ansible.builtin.file:
    path: "{{ ssd_mountpoint }}/podman"
    state: directory
    mode: "0711"

- name: Autoriser les containers rootless à utiliser les périphériques DRI (GPU)
  ansible.posix.seboolean:
    name: container_use_dri_devices
    state: true
    persistent: true

- name: Créer chaque utilisateur système dédié à un groupe de pods
  ansible.builtin.user:
    name: "{{ item.name }}"
    system: true
    shell: /usr/sbin/nologin
    home: "/home/{{ item.name }}"
    create_home: true
  loop: "{{ containers_users }}"
  loop_control:
    label: "{{ item.name }}"

# Défense en profondeur : les secrets (voidauth.env, storage.conf...) sous
# ~/.config/ sont déjà déployés en 0600, mais ça ne protège pas grand-chose si
# le home directory lui-même reste lisible par d'autres comptes du système
# (dépend du umask/HOME_MODE par défaut, pas garanti). On le verrouille
# explicitement plutôt que de compter dessus implicitement.
- name: Verrouiller les home directories des utilisateurs de service
  ansible.builtin.file:
    path: "/home/{{ item.name }}"
    state: directory
    mode: "0750"
  loop: "{{ containers_users }}"
  loop_control:
    label: "{{ item.name }}"

- name: Ajouter les groupes supplémentaires nécessaires (ex. GPU pour svc-media)
  ansible.builtin.user:
    name: "{{ item.name }}"
    groups: "{{ item.extra_groups | join(',') }}"
    append: true
  loop: "{{ containers_users }}"
  when: item.extra_groups | length > 0
  loop_control:
    label: "{{ item.name }}"

# Requis pour rootless Podman : contrairement aux utilisateurs normaux,
# les comptes système (créés avec system: true / useradd --system) n'obtiennent
# PAS de plage subuid/subgid automatiquement. Sans ça, tout pull d'image échoue
# avec "potentially insufficient UIDs or GIDs available in user namespace".
- name: Assigner une plage subuid dédiée à chaque utilisateur
  ansible.builtin.lineinfile:
    path: /etc/subuid
    regexp: "^{{ item.name }}:"
    line: "{{ item.name }}:{{ item.subuid_start }}:65536"
    state: present
  register: podman_subuid_result
  loop: "{{ containers_users }}"
  loop_control:
    label: "{{ item.name }}"

- name: Assigner une plage subgid dédiée à chaque utilisateur
  ansible.builtin.lineinfile:
    path: /etc/subgid
    regexp: "^{{ item.name }}:"
    line: "{{ item.name }}:{{ item.subuid_start }}:65536"
    state: present
  register: podman_subgid_result
  loop: "{{ containers_users }}"
  loop_control:
    label: "{{ item.name }}"

- name: Activer le lingering pour chaque utilisateur
  ansible.builtin.command:
    cmd: "loginctl enable-linger {{ item.name }}"
    creates: "/var/lib/systemd/linger/{{ item.name }}"
  loop: "{{ containers_users }}"
  loop_control:
    label: "{{ item.name }}"

- name: Récupérer l'UID de chaque utilisateur (pour runroot et system migrate)
  # Note : contrairement aux rôles applicatifs (jellyfin, sonarr, ...) qui
  # utilisent désormais `ansible.builtin.getent` pour un seul utilisateur à la
  # fois, ce rôle a besoin de conserver les UID de PLUSIEURS utilisateurs
  # simultanément dans une liste (`.results`) pour les boucles suivantes.
  # `getent` écrase `ansible_facts.getent_passwd` à chaque appel plutôt que de
  # fusionner les entrées (vérifié) : il ne convient donc pas à ce cas précis,
  # `command` + `register` reste le bon outil ici.
  ansible.builtin.command:
    cmd: "id -u {{ item.name }}"
  register: podman_containers_users_uids
  changed_when: false
  loop: "{{ containers_users }}"
  loop_control:
    label: "{{ item.name }}"

- name: Créer le dossier de stockage Podman par utilisateur
  ansible.builtin.file:
    path: "{{ ssd_mountpoint }}/podman/{{ item.name }}/storage"
    state: directory
    owner: "{{ item.name }}"
    group: "{{ item.name }}"
    mode: "0700"
  loop: "{{ containers_users }}"
  loop_control:
    label: "{{ item.name }}"

- name: Déclarer le contexte SELinux pour chaque dossier de stockage Podman
  community.general.sefcontext:
    target: "{{ ssd_mountpoint }}/podman/{{ item.name }}(/.*)?"
    setype: container_var_lib_t
    state: present
  loop: "{{ containers_users }}"
  loop_control:
    label: "{{ item.name }}"

- name: Appliquer le contexte SELinux (restorecon) par utilisateur
  ansible.builtin.command:
    cmd: "restorecon -Rv {{ ssd_mountpoint }}/podman/{{ item.name }}"
  loop: "{{ containers_users }}"
  loop_control:
    label: "{{ item.name }}"
  register: podman_restorecon
  changed_when: "'Relabeled' in podman_restorecon.stdout"

- name: Créer le dossier de config containers (~/.config/containers) par utilisateur
  ansible.builtin.file:
    path: "/home/{{ item.name }}/.config/containers"
    state: directory
    owner: "{{ item.name }}"
    group: "{{ item.name }}"
    mode: "0700"
  loop: "{{ containers_users }}"
  loop_control:
    label: "{{ item.name }}"

- name: Configurer storage.conf par utilisateur (graphroot sur le SSD)
  ansible.builtin.template:
    src: storage.conf.j2
    dest: "/home/{{ item.item.name }}/.config/containers/storage.conf"
    owner: "{{ item.item.name }}"
    group: "{{ item.item.name }}"
    mode: "0600"
  vars:
    podman_current_user: "{{ item.item.name }}"
    podman_current_uid: "{{ item.stdout | trim }}"
  loop: "{{ podman_containers_users_uids.results }}"
  loop_control:
    label: "{{ item.item.name }}"

# Déplacé après storage.conf (contrairement à la version précédente) : la toute
# première commande podman d'un utilisateur initialise le storage à l'emplacement
# lu dans storage.conf. Si "system migrate" tournait avant, le storage se serait
# initialisé au chemin par défaut (~/.local/share/containers/storage, sur le
# disque OS) avant que le graphroot SSD ne soit pris en compte.
# Applique aussi la plage subuid/subgid : sans ça, un stockage rootless déjà
# initialisé avec l'ancien mapping (ou l'absence de mapping) resterait
# incohérent tant que le "podman unshare" pause process n'est pas relancé.
# "podman system migrate" n'a pas de sortie exploitable pour détecter un
# changement : elle est silencieuse en cas de succès, que la migration ait
# eu du travail à faire ou non. Contrairement à grub2-mkconfig
# (roles/kernel_longterm), pas de "Nothing to do" à chercher dans le
# stdout. On se base donc sur le seul signal fiable dont on dispose déjà :
# la plage subuid/subgid de l'utilisateur a-t-elle réellement changé lors
# de CE run ? C'est d'ailleurs exactement la raison documentée plus haut
# pour laquelle cette tâche existe.
# Limite connue : un upgrade du paquet podman lui-même (changement de
# format de storage) peut aussi nécessiter un "system migrate" sans que le
# subuid/subgid n'ait bougé - dans ce cas, relance-le une fois à la main
# ou avec --tags podman après un `dnf upgrade podman`.
- name: Regrouper l'état "changed" du subuid par utilisateur
  ansible.builtin.set_fact:
    podman_subid_changed_by_user: "{{ podman_subid_changed_by_user | default({}) | combine({item.item.name: item.changed}) }}"
  loop: "{{ podman_subuid_result.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Fusionner l'état "changed" du subgid par utilisateur
  ansible.builtin.set_fact:
    podman_subid_changed_by_user: "{{ podman_subid_changed_by_user | combine({item.item.name: (podman_subid_changed_by_user[item.item.name] or item.changed)}) }}"
  loop: "{{ podman_subgid_result.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Appliquer la nouvelle configuration subuid/subgid (podman system migrate)
  become: true
  become_user: "{{ item.item.name }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ item.stdout | trim }}"
  ansible.builtin.command:
    cmd: podman system migrate
  loop: "{{ podman_containers_users_uids.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: podman_subid_changed_by_user[item.item.name]
  changed_when: true

- name: Activer et démarrer podman.socket pour chaque utilisateur
  become: true
  become_user: "{{ item.item.name }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ item.stdout | trim }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ item.stdout | trim }}/bus"
  ansible.builtin.systemd:
    name: podman.socket
    scope: user
    state: started
    enabled: true
  loop: "{{ podman_containers_users_uids.results }}"
  loop_control:
    label: "{{ item.item.name }}"

# AutoUpdate=registry sur les quadlets (caddy, jellyfin, sonarr, ...) ne sert
# à rien sans ce timer : c'est lui qui déclenche périodiquement "podman auto-update".
- name: Activer le timer podman-auto-update pour chaque utilisateur
  become: true
  become_user: "{{ item.item.name }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ item.stdout | trim }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ item.stdout | trim }}/bus"
  ansible.builtin.systemd:
    name: podman-auto-update.timer
    scope: user
    state: started
    enabled: true
  loop: "{{ podman_containers_users_uids.results }}"
  loop_control:
    label: "{{ item.item.name }}"
