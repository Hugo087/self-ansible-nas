---
# Durcissement SSH minimal : clés uniquement, pas de root, moins de
# tentatives avant fermeture de connexion. Le jail fail2ban sshd
# (roles/fail2ban) bannit déjà les IP après échecs répétés, mais ça ne
# remplace pas la fermeture de la porte elle-même : un bruteforce ne
# devrait pas être possible à essayer en premier lieu si le mot de passe
# n'est de toute façon jamais accepté.
#
# GARDE-FOU obligatoire avant de couper l'auth par mot de passe : ce rôle
# vérifie qu'une clé publique est déjà enregistrée pour l'utilisateur qui
# exécute ce playbook ({{ ansible_user }}), sinon désactiver
# PasswordAuthentication couperait l'accès SSH pour de bon - ce genre de
# NAS n'a en général pas de console physique/IPMI de secours.

- name: Récupérer le home de {{ ansible_user }}
  ansible.builtin.command:
    cmd: "getent passwd {{ ansible_user }}"
  changed_when: false
  register: ssh_hardening_user_check

- name: Localiser authorized_keys de {{ ansible_user }}
  ansible.builtin.set_fact:
    ssh_hardening_authorized_keys_path: "{{ ssh_hardening_user_check.stdout.split(':')[5] }}/.ssh/authorized_keys"

- name: Vérifier que authorized_keys existe et n'est pas vide
  ansible.builtin.stat:
    path: "{{ ssh_hardening_authorized_keys_path }}"
  register: ssh_hardening_authorized_keys_stat

- name: Stopper si aucune clé publique n'est enregistrée (évite de te verrouiller dehors)
  ansible.builtin.fail:
    msg: >-
      Aucune clé publique trouvée dans {{ ssh_hardening_authorized_keys_path }}
      pour {{ ansible_user }}. Ajoute ta clé publique (ssh-copy-id, ou le
      module ansible.posix.authorized_key) et relance ce rôle avant de
      désactiver PasswordAuthentication - sinon tu perds l'accès SSH à ce
      NAS au prochain redémarrage de sshd.
  when: >
    not ssh_hardening_authorized_keys_stat.stat.exists or
    ssh_hardening_authorized_keys_stat.stat.size == 0

# validate: "sshd -t -f %s" fait tester la syntaxe par sshd lui-même sur
# le fichier temporaire AVANT remplacement - une ligne mal formée ne casse
# donc jamais la config en place.
- name: Durcir sshd_config
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    validate: "sshd -t -f %s"
  loop:
    - regexp: '^#?\s*PermitRootLogin'
      line: 'PermitRootLogin no'
    - regexp: '^#?\s*PasswordAuthentication'
      line: 'PasswordAuthentication no'
    - regexp: '^#?\s*KbdInteractiveAuthentication'
      line: 'KbdInteractiveAuthentication no'
    - regexp: '^#?\s*PermitEmptyPasswords'
      line: 'PermitEmptyPasswords no'
    - regexp: '^#?\s*PubkeyAuthentication'
      line: 'PubkeyAuthentication yes'
    - regexp: '^#?\s*MaxAuthTries'
      line: 'MaxAuthTries {{ ssh_hardening_max_auth_tries }}'
    - regexp: '^#?\s*X11Forwarding'
      line: 'X11Forwarding no'
  loop_control:
    label: "{{ item.line }}"
  notify: Restart sshd
