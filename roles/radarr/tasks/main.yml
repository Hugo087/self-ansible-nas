---
- name: Récupérer l'UID de l'utilisateur média
  ansible.builtin.command:
    cmd: "id -u {{ media_user }}"
  register: radarr_media_uid
  changed_when: false

- name: Récupérer le GID de l'utilisateur média
  ansible.builtin.command:
    cmd: "id -g {{ media_user }}"
  register: radarr_media_gid
  changed_when: false

- name: Créer le dossier appdata Radarr
  ansible.builtin.file:
    path: "{{ ssd_mountpoint }}/appdata/radarr/config"
    state: directory
    owner: "{{ media_user }}"
    group: "{{ media_user }}"
    mode: "0755"

- name: Déployer le quadlet Radarr
  ansible.builtin.template:
    src: radarr.container.j2
    dest: "/home/{{ media_user }}/.config/containers/systemd/radarr.container"
    owner: "{{ media_user }}"
    group: "{{ media_user }}"
    mode: "0644"
  vars:
    radarr_puid: "{{ radarr_media_uid.stdout | trim }}"
    radarr_pgid: "{{ radarr_media_gid.stdout | trim }}"

# Pas de notify/handler ici : le daemon-reload est fait directement ci-dessous,
# dans l'ordre, pour éviter le genre d'oubli de fichier handler déjà rencontré
# sur les rôles précédents.
- name: Forcer le systemd --user daemon-reload (radarr)
  become: true
  become_user: "{{ media_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ radarr_media_uid.stdout | trim }}"
  ansible.builtin.systemd:
    scope: user
    daemon_reload: true

- name: Démarrer et activer Radarr
  become: true
  become_user: "{{ media_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ radarr_media_uid.stdout | trim }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ radarr_media_uid.stdout | trim }}/bus"
  ansible.builtin.systemd:
    name: radarr.service
    scope: user
    state: started
    enabled: true
