---
- name: Déployer Radarr (appdata, quadlet, service)
  ansible.builtin.include_tasks: ../../quadlet_common/tasks/deploy.yml
  vars:
    quadlet_user: "{{ media_user }}"
    quadlet_name: "radarr"
    quadlet_units:
      - src: radarr.container.j2
        name: radarr.container
        service: radarr.service
