---
# Créé explicitement ici, AVANT le include quadlet_common ci-dessous : le
# quadlet voidauth.container bind-monte healthcheck.sh (voir
# voidauth.container.j2), donc ce fichier doit déjà exister sur le disque
# au moment où quadlet_common démarre le service - sinon podman échoue
# avec "statfs ...: no such file or directory" (même bug que celui
# rencontré sur roles/caddy, corrigé pour la même raison : la dernière
# tâche de quadlet_common/tasks/deploy.yml démarre le service, donc tout
# ce dont le quadlet a besoin doit être déployé avant cet include, pas
# après).
# mode 0750 : cohérent avec le mode utilisé par quadlet_common pour ce
# même dossier (voir quadlet_common/tasks/deploy.yml).
- name: Créer le dossier appdata de VoidAuth
  ansible.builtin.file:
    path: "{{ ssd_mountpoint }}/appdata/voidauth"
    state: directory
    owner: "{{ sso_user }}"
    group: "{{ sso_user }}"
    mode: "0750"

- name: Déployer VoidAuth (appdata, réseau, quadlets, services)
  ansible.builtin.include_tasks: ../../quadlet_common/tasks/deploy.yml
  vars:
    quadlet_user: "{{ sso_user }}"
    quadlet_name: "voidauth"
    # Les deux fichiers d'environnement contiennent des secrets (mot de passe
    # DB, storage key, clé API SMTP) : déployés en 0600 par quadlet_common,
    # jamais en Environment= en dur dans un .container (qui serait en 0644 et
    # donc lisible par tout compte du système).
    quadlet_env_files:
      - src: voidauth.env.j2
        dest: "{{ ssd_mountpoint }}/appdata/voidauth/voidauth.env"
      - src: voidauth-db.env.j2
        dest: "{{ ssd_mountpoint }}/appdata/voidauth/voidauth-db.env"
    quadlet_units:
      # Pas de clé "service" pour le réseau : cf. commentaire dans
      # quadlet_common/tasks/deploy.yml.
      - src: sso.network.j2
        name: sso.network
      - src: voidauth-db.container.j2
        name: voidauth-db.container
        service: voidauth-db.service
      - src: voidauth.container.j2
        name: voidauth.container
        service: voidauth.service
