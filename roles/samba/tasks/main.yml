# roles/samba/tasks/main.yml
---
- name: Install Samba packages
  ansible.builtin.dnf:
    name:
      - samba
      - samba-common-tools
    state: present

- name: Ensure SELinux boolean for home directories
  ansible.posix.seboolean:
    name: samba_enable_home_dirs
    state: true
    persistent: true

# Remplace l'ancien booléen samba_export_all_rw (qui autorisait Samba à
# lire/écrire sur N'IMPORTE QUEL contexte SELinux, y compris
# container_var_lib_t) par un contexte dédié samba_share_t, posé
# explicitement sur les deux seuls dossiers réellement exposés. Plus
# cohérent avec l'usage ciblé de sefcontext déjà fait dans roles/podman.
- name: Créer le dossier de partage personnel (SSD, séparé de appdata/podman)
  ansible.builtin.file:
    path: "{{ samba_shared_dir }}"
    state: directory
    owner: "{{ samba_valid_users[0] }}"
    group: "{{ samba_valid_users[0] }}"
    mode: "0750"
    recurse: true

- name: Déclarer le contexte SELinux samba_share_t sur les dossiers exposés
  community.general.sefcontext:
    target: "{{ item }}(/.*)?"
    setype: samba_share_t
    state: present
  loop:
    - "{{ samba_shared_dir }}"
    - "{{ hdd_mountpoint }}/media"

- name: Appliquer le contexte SELinux (restorecon) sur les dossiers exposés
  ansible.builtin.command:
    cmd: "restorecon -Rv {{ item }}"
  loop:
    - "{{ samba_shared_dir }}"
    - "{{ hdd_mountpoint }}/media"
  register: samba_restorecon
  changed_when: "'Relabeled' in samba_restorecon.stdout"

- name: Deploy smb.conf
  ansible.builtin.template:
    src: smb.conf.j2
    dest: /etc/samba/smb.conf
    owner: root
    group: root
    mode: "0644"
  register: samba_conf_deployed

- name: Vérifier quels comptes Samba existent déjà
  ansible.builtin.command:
    cmd: "pdbedit -L -u {{ item.username }}"
  environment:
    SMB_CONF_PATH: /etc/samba/smb.conf
  loop: "{{ samba_accounts }}"
  loop_control:
    label: "{{ item.username }}"
  register: samba_user_check
  failed_when: false
  changed_when: false

# pdbedit -a (add) échoue si le compte existe déjà (NT_STATUS_USER_EXISTS) :
# sans cette vérification préalable, le rôle cassait dès le 2e run.
- name: Créer les comptes Samba manquants
  ansible.builtin.command:
    cmd: "pdbedit -a -u {{ item.item.username }} -t"
    stdin: "{{ item.item.password }}\n{{ item.item.password }}\n"
  environment:
    SMB_CONF_PATH: /etc/samba/smb.conf
  loop: "{{ samba_user_check.results }}"
  loop_control:
    label: "{{ item.item.username }}"
  when: item.rc != 0
  no_log: true
  changed_when: true


# smbpasswd n'a pas de mode "changed_when" fiable : rejouer la commande à
# chaque run réécrit systématiquement le hash NT sur disque, même sans
# rien changer. On compare donc le mot de passe voulu à une empreinte
# SHA-256 stockée à part (jamais le mot de passe en clair) et on ne touche
# à smbpasswd que si elle diffère - vraie idempotence, pas juste un
# changed_when: false qui masque une écriture systématique.
- name: Calculer l'empreinte des mots de passe Samba voulus
  ansible.builtin.set_fact:
    samba_wanted_password_hashes: "{{ samba_wanted_password_hashes | default({}) | combine({item.username: item.password | hash('sha256')}) }}"
  loop: "{{ samba_accounts }}"
  loop_control:
    label: "{{ item.username }}"
  no_log: true

- name: Lire l'empreinte du dernier mot de passe appliqué (si elle existe)
  ansible.builtin.slurp:
    src: "/etc/samba/.pwhash-{{ item.username }}"
  loop: "{{ samba_accounts }}"
  loop_control:
    label: "{{ item.username }}"
  register: samba_applied_password_hashes
  failed_when: false
  no_log: true

- name: Mettre à jour le mot de passe des comptes Samba dont le mot de passe a réellement changé
  ansible.builtin.command:
    cmd: "smbpasswd -s {{ item.item.username }}"
    stdin: "{{ item.item.password }}\n{{ item.item.password }}\n"
  loop: "{{ samba_applied_password_hashes.results }}"
  loop_control:
    label: "{{ item.item.username }}"
  when: >
    item.content is not defined or
    (item.content | b64decode) != samba_wanted_password_hashes[item.item.username]
  no_log: true
  changed_when: true
  register: samba_password_updated

- name: Enregistrer l'empreinte du mot de passe appliqué
  ansible.builtin.copy:
    content: "{{ samba_wanted_password_hashes[item.username] }}"
    dest: "/etc/samba/.pwhash-{{ item.username }}"
    owner: root
    group: root
    mode: "0600"
  loop: "{{ samba_accounts }}"
  loop_control:
    label: "{{ item.username }}"
  no_log: true

- name: Ensure firewall allows SMB
  ansible.posix.firewalld:
    port: "{{ item }}/tcp"
    permanent: true
    immediate: true
    state: enabled
  loop:
    - 139
    - 445

# Comme dans quadlet_common : restart uniquement si smb.conf a réellement
# changé, pour ne pas couper les clients SMB déjà connectés à chaque run
# ansible qui ne modifie rien à la config.
- name: Restart and enable Samba services
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: "{{ 'restarted' if samba_conf_deployed.changed else 'started' }}"
  loop:
    - smb.service
    - nmb.service
