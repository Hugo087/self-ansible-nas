[defaults]
inventory = inventory.ini
roles_path = roles
# Évite l'accumulation de fichiers .retry à la racine après un run en échec.
retry_files_enabled = False
# Laissé à True (défaut) volontairement : ce projet gère un NAS avec des
# données réelles, mieux vaut être notifié d'un changement de clé hôte SSH
# que de le contourner silencieusement.
host_key_checking = True
interpreter_python = auto_silent

[ssh_connection]
pipelining = True
